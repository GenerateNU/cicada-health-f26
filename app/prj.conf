# add desired CONFIGs here
CONFIG_GPIO=y
CONFIG_PRINTK=y

#BLE
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Wearable Device"

# LED Strip support
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y 